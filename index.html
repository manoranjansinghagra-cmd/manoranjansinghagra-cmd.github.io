<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Transmission — Cinematic Flash</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061225}
.flash-hero{
  position:relative;width:100%;height:100vh;min-height:520px;
  overflow:hidden;background:#061225;color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}
.slide{
  position:absolute;inset:-4%;
  background-size:cover;background-position:center;
  opacity:0;transform:scale(1.06);
  animation:powerSlide 18s infinite;
}
.slide:nth-child(1){background-image:url("./bg-transmission-tower.png");animation-delay:0s}
.slide:nth-child(2){background-image:url("./bg-transmission-tower-02.png");animation-delay:6s}
.slide:nth-child(3){background-image:url("./bg-transmission-tower-03.png");animation-delay:12s}

.slide:after{
  content:"";position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(3,12,28,.82),rgba(3,12,28,.32) 48%,rgba(3,12,28,.60)),
    linear-gradient(0deg,rgba(3,12,28,.78),transparent 55%);
}

.energy-beam{
  position:absolute;top:-25%;left:-35%;width:22%;height:160%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),rgba(255,210,70,.88),rgba(255,255,255,.18),transparent);
  filter:blur(7px);transform:rotate(18deg);
  animation:beam 5.5s ease-in-out infinite;
  z-index:3;pointer-events:none;
}
.power-flash{
  position:absolute;inset:0;background:#fff;opacity:0;
  animation:flash 6s ease-in-out infinite;
  z-index:2;pointer-events:none;
}
.content{
  position:relative;z-index:5;height:100%;
  display:flex;align-items:center;padding:8vw;
  max-width:1000px;
}
.badge{
  display:inline-block;padding:8px 14px;border:1px solid rgba(255,210,70,.7);
  border-radius:999px;color:#ffd45a;background:rgba(5,18,38,.55);
  letter-spacing:2px;font-size:12px;text-transform:uppercase;
}
h1{font-size:clamp(42px,7vw,86px);line-height:.95;margin:20px 0 14px}
h1 span{color:#ffd45a}
p{font-size:clamp(16px,2vw,22px);line-height:1.55;color:#dbe7f5;max-width:650px}
@keyframes powerSlide{
  0%{opacity:0;transform:scale(1.06)}
  8%{opacity:1}
  30%{opacity:1;transform:scale(1)}
  36%{opacity:0;transform:scale(1.02)}
  100%{opacity:0}
}
@keyframes beam{
  0%{left:-40%;opacity:0}
  12%{opacity:1}
  55%{left:115%;opacity:.75}
  65%,100%{left:125%;opacity:0}
}
@keyframes flash{
  0%,46%,100%{opacity:0}
  48%{opacity:.18}
  49%{opacity:0}
  50%{opacity:.08}
  51%{opacity:0}
}
@media (prefers-reduced-motion:reduce){
  .slide{animation:none;opacity:1;transform:none}
  .slide:not(:first-child),.energy-beam,.power-flash{display:none}
}
</style>
</head>
<body>
<section class="flash-hero" aria-label="Power transmission cinematic background">
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="power-flash"></div>
  <div class="energy-beam"></div>

  <div class="content">
    <div>
      <div class="badge">Power Transmission • Executive Portfolio</div>
      <h1>Connecting <span>Energy.</span><br>Strengthening Nation.</h1>
      <p>Transmission lines, grid infrastructure and project leadership — presented with a cinematic power-flow effect.</p>
    </div>
  </div>
</section>
</body>
</html>
